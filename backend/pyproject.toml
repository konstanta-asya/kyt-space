[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — isort, B — bugbear, UP — pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
extend-ignore = [
    "B008",   # Depends(...) у сигнатурах FastAPI — стандартний патерн
    "UP042",  # Role(str, Enum) лишаємо: StrEnum змінює поведінку str()
]

[tool.ruff.lint.isort]
# без цього ruff бачить теку alembic/ і вважає пакет alembic локальним
known-third-party = ["alembic"]
