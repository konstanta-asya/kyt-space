services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kyt
      POSTGRES_PASSWORD: kyt
      POSTGRES_DB: kyt_space
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env

volumes:
  pgdata:
